<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>{{{ PRODUCT_NAME }}}</title>
        <link rel="preconnect" href="https://bridge.playgama.com">
        <link rel="preload" href="Build/{{{ CODE_FILENAME }}}" as="fetch" type="application/wasm" crossorigin>
        <link rel="preload" href="Build/{{{ DATA_FILENAME }}}" as="fetch" crossorigin>
        <link rel="preload" href="Build/{{{ FRAMEWORK_FILENAME }}}" as="script">
        <link rel="preload" href="TemplateData/Field.png" as="image">
        <link rel="preload" href="TemplateData/HaystackBg.png" as="image">
        <link rel="preload" href="TemplateData/HaystackFill.png" as="image">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                padding: 0px;
                margin: 0px;
                overflow: hidden;
                overscroll-behavior: none;
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
                background: #7eb8e8;
            }
            .fullscreen-canvas {
                background: #7eb8e8;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0px;
                left: 0px;
            }
            #haystack-loading-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 10000000;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #7eb8e8;
                background-image: url('TemplateData/Field.png');
                background-size: cover;
                background-position: center;
                pointer-events: none;
                opacity: 1;
                transition: opacity 300ms ease;
            }
            #haystack-loading-overlay.is-hidden {
                opacity: 0;
            }
            /* Playgama Bridge injects its emblem loader as #loading-overlay */
            #loading-overlay,
            #logo,
            #loading-hint {
                display: none !important;
                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;
            }
            .haystack {
                position: relative;
                width: min(42vw, 52vh);
                aspect-ratio: 1374 / 1145;
            }
            .haystack-bg,
            .haystack-fill {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center bottom;
            }
            .haystack-fill {
                clip-path: inset(100% 0 0 0);
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" class="fullscreen-canvas"></canvas>
        <div id="haystack-loading-overlay">
            <div class="haystack">
                <img class="haystack-bg" src="TemplateData/HaystackBg.png" alt="">
                <img id="haystack-fill" class="haystack-fill" src="TemplateData/HaystackFill.png" alt="">
            </div>
        </div>
        <script>
            document.addEventListener('contextmenu', function (event) {
                event.preventDefault();
            });
            var canvas = document.getElementById('canvas');
            if (canvas) {
                canvas.addEventListener('contextmenu', function (event) {
                    event.preventDefault();
                });
            }
        </script>
        <script src="./playgama-bridge-unity.js"></script>
    </body>
</html>
